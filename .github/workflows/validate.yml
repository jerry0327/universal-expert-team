name: Validate skill and release archive

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        # v4.4.0: https://github.com/actions/checkout/releases/tag/v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate public package
        run: python3 scripts/validate.py
      - name: Test archive boundaries and reproducibility
        run: python3 -m unittest discover -s tests -v
      - name: Build release archive
        run: python3 scripts/build_release.py
